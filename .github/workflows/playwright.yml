name: Playwright Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Docker Compose
        run: |
            sudo curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
            sudo chmod +x /usr/local/bin/docker-compose
            docker-compose version

      - name: Start Kong via Docker Compose
        run: docker-compose up -d

      - name: Wait for Kong API to be ready
        run: |
          echo "Waiting for Kong API to be ready..."
          for i in {1..40}; do
            if curl -s http://localhost:8001/status | grep -q '"database"'; then
            echo "Kong API is ready"
            break
            fi
            echo "Still waiting for Kong API..."
            sleep 3
          done
      
      - name: Wait for Kong Manager to be fully ready
        run: |
          echo "Waiting for Kong Manager UI to fully load..."
          npm install -g node-fetch
    
          cat > wait-for-kong-ui.js << 'EOF'
          const fetch = require('node-fetch');
          const TIMEOUT = 120000;
          const INTERVAL = 3000;
    
          async function checkUI() {
            try {
              const response = await fetch('http://localhost:8002');
              const text = await response.text();
        
              console.log('Kong Manager responded');
              //wait for the JS execution
              await new Promise(r => setTimeout(r, 15000));
              return true;
            } catch (err) {
              console.log('Connection failed, retrying...')
              return false;
            }
          }
          async function waitForUI() {
            const start = Date.now();
            while (Date.now() - start < TIMEOUT) {
              if (await checkUI()) {
                console.log('Kong Manager is fully ready');
                process.exit(0);
              }
              console.log('Still waiting for Kong Manager...');
              await new Promise(r => setTimeout(r, INTERVAL));
            }
            console.error('Kong Manager failed to start within timeout');
            process.exit(1);
          }
          waitForUI();
          EOF
          node wait-for-kong-ui.js

      # Cache npm dependencies
      - name: Cache npm modules
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: npm-cache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-cache-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci
        
      # Cache Playwright browsers
      - name: Cache Playwright browsers
        uses: actions/cache@v3
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browser-cache-${{ runner.os }}-v1

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests (CI mode)
        env:
          CI: true
          BASE_URL: http://localhost:8002
          
        run: npx playwright test

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results
          retention-days: 7
        
      - name: Stop Docker Compose
        if: always()
        run: docker-compose down -v