name: Playwright Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Docker Compose
        run: |
            sudo curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
            sudo chmod +x /usr/local/bin/docker-compose
            docker-compose version

      - name: Start Kong via Docker Compose
        run: docker-compose up -d

      - name: Wait for Kong API to be ready
        run:
          echo "Waiting for Kong API to be ready..."
          for i in {1..40}; do
            STATUS=$(curl -s http://localhost:8001/status || true)
            if echo "$STATUS" | grep -q '"database"'; then
              echo "Kong API is ready"
              echo "$STATUS"
              break
            fi
            echo "Still waiting for Kong API..."
            sleep 3
          done
      
      - name: Wait for Kong UI to be ready
        run:
            echo "Waiting for Kong UI to be ready..."
            for i in {1..15}; do
              if curl -s http://localhost:8002; then
                echo "Kong UI is up!"
                break
              fi
              sleep 2
            done

      # Cache npm dependencies
      - name: Cache npm modules
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: npm-cache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-cache-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci
        
      # Cache Playwright browsers
      - name: Cache Playwright browsers
        uses: actions/cache@v3
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browser-cache-${{ runner.os }}-v1

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests (CI mode)
        env:
          CI: true
          BASE_URL: http://localhost:8002
          
        run: npx playwright test

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results
          retention-days: 7
        
      - name: Stop Docker Compose
        if: always()
        run: docker-compose down -v